services:
  # Elasticsearch for vector search and metadata
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: autobahncv-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.watermark.low.max_headroom=200gb
      - cluster.routing.allocation.disk.watermark.high.max_headroom=150gb
      - cluster.routing.allocation.disk.watermark.flood_stage.max_headroom=100gb
      - cluster.routing.allocation.disk.watermark.flood_stage.frozen.max_headroom=20gb
      - cluster.routing.allocation.disk.watermark.high=95%
      - cluster.routing.allocation.disk.watermark.flood_stage=98%
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - autobahncv-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO - S3-compatible object storage (Garage-compatible API)
  minio:
    image: minio/minio:latest
    container_name: autobahncv-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=Q3AM3UQ867SPQQA43P2F
      - MINIO_ROOT_PASSWORD=zuf+tfteSlswRu7BJ86wekitnifILbZam1KYY3TG
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    networks:
      - autobahncv-network
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO setup job (creates bucket and sets policy)
  minio-setup:
    image: minio/mc:latest
    container_name: autobahncv-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...' &&
      sleep 5 &&
      echo 'Configuring MinIO...' &&
      mc alias set local http://minio:9000 Q3AM3UQ867SPQQA43P2F zuf+tfteSlswRu7BJ86wekitnifILbZam1KYY3TG &&
      mc mb local/autobahncv || true &&
      mc anonymous set download local/autobahncv &&
      echo 'MinIO setup complete!'
      "
    networks:
      - autobahncv-network

  # Elasticsearch setup job (creates index mapping)
  es-setup:
    image: curlimages/curl:latest
    container_name: autobahncv-es-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo 'Waiting for Elasticsearch to be ready...'
        sleep 10
        echo 'Checking Elasticsearch index mapping...'
        if curl -fs 'http://elasticsearch:9200/cars/_mapping' \
          | grep -q '"dims":2048'; then
          echo 'Elasticsearch index mapping is already current.'
        else
          echo 'Recreating Elasticsearch index mapping...'
          curl -s -X DELETE 'http://elasticsearch:9200/cars' || true
          curl -s -X PUT 'http://elasticsearch:9200/cars' \
            -H 'Content-Type: application/json' \
            -d '{
            "settings": {
              "number_of_shards": 1,
              "number_of_replicas": 0
            },
            "mappings": {
              "properties": {
                "car_id": { "type": "keyword" },
                "plate_number": { "type": "keyword" },
                "embedding": {
                  "type": "dense_vector",
                  "dims": 2048,
                  "index": true,
                  "similarity": "cosine"
                },
                "s3_key": { "type": "keyword" },
                "metadata": { "type": "object" },
                "created_at": { "type": "date" }
              }
            }
          }'
          echo ''
          echo 'Elasticsearch index mapping created successfully!'
        fi
    networks:
      - autobahncv-network

  # Kibana (optional, for Elasticsearch visualization)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: autobahncv-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - autobahncv-network
    profiles:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: autobahncv-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - autobahncv-network

  grafana:
    image: grafana/grafana:latest
    container_name: autobahncv-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - autobahncv-network

  # AutobahnCV Application
  app:
    build: .
    container_name: autobahncv-app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - ML_STRICT_STARTUP=False
      - ML_ALLOW_HEURISTIC_PLATE_FALLBACK=False
      - ML_ALLOW_FULL_IMAGE_CAR_FALLBACK=True
      - ML_DEBUG_IMAGE_DIR=/tmp/autobahncv-debug
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_USERNAME=
      - ELASTICSEARCH_PASSWORD=
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=Q3AM3UQ867SPQQA43P2F
      - S3_SECRET_KEY=zuf+tfteSlswRu7BJ86wekitnifILbZam1KYY3TG
      - S3_BUCKET_NAME=autobahncv
      - S3_REGION=us-east-1
      - S3_USE_SSL=False
      - NEURON1_CAR_DETECTION_MODEL=/app/models/car_detector.pt
      - NEURON1_CONFIDENCE_THRESHOLD=0.25
      - NEURON2_PLATE_DETECTION_MODEL=/app/models/license_plate_detector.pt
      - NEURON3_OCR_MODEL=/app/models/plate_ocr.pt
      - NEURON3_CONFIDENCE_THRESHOLD=0.45
      - NEURON4_RESNET_MODEL=/app/models/car_embedder.pt
      - NEURON4_EMBEDDING_DIM=2048
    volumes:
      - ./models:/app/models:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-setup:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    networks:
      - autobahncv-network
    profiles:
      - full

  # Frontend - React SPA served via Nginx with API proxy
  frontend:
    build: ./frontend
    container_name: autobahncv-frontend
    ports:
      - "3000:80"
    depends_on:
      - app
    networks:
      - autobahncv-network
    profiles:
      - full
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: autobahncv-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow-artifacts
    networks:
      - autobahncv-network
      
volumes:
  es_data:
    driver: local
  minio_data:
    driver: local
  mlflow_data:
    driver: local

networks:
  autobahncv-network:
    driver: bridge
